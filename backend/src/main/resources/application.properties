spring.application.name=servicedesk
server.port=8080


# ===================================================================
# BASE DE DATOS (SQL Server 2022)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db_servicedesk;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:adminUTP_123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.hospital.servicedesk=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Desactiva la inclusión de stacktraces en la respuesta predeterminada de Spring
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
jwt.expiration=3600000
