spring.application.name=servicedesk
server.port=8080


# ===================================================================
# BASE DE DATOS (PostgreSQL / MySQL)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db_servicedesk;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.tuempresa.servicedesk=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Desactiva la inclusión de stacktraces en la respuesta predeterminada de Spring
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
