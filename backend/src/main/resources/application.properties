spring.application.name=servicedesk
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=NONE

# ===================================================================
# BASE DE DATOS (SQL Server 2022)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=db_servicedesk;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# LOGGING BASE (Configurado detalladamente en logback-spring.xml)
# ===================================================================
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.hospital.servicedesk=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Desactiva la inclusión de stacktraces en la respuesta predeterminada de Spring
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Carga de variables de entorno desde .env local
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# ===================================================================
# SEGURIDAD JWT
# ===================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================================================================
# CORREO INSTITUCIONAL (Spring Mail)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:mesadeayuda@hsmsi.gob.pe}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


