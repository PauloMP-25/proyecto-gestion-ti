<!-- Backdrop para cerrar en móvil al dar tap fuera -->
<div 
  class="sidebar-backdrop" 
  [class.abierto]="sidebarAbierto()" 
  (click)="cerrarEnMovil()"
  aria-hidden="true">
</div>

<aside 
  id="menu-lateral"
  class="menu-lateral" 
  [class.movil-abierto]="sidebarAbierto()"
  [class.colapsado]="sidebarColapsado()"
  aria-label="Menú principal de navegación">

  <!-- Cabecera visible en móvil -->
  <app-cabecera-menu-movil (alCerrar)="cerrarEnMovil()" />

  <!-- Navegación por grupos -->
  <nav class="sidebar-nav">
    @for (seccion of seccionesMenu(); track seccion.encabezado || $index) {
      <app-menu-grupo
        [seccion]="seccion"
        [colapsado]="sidebarColapsado()"
        (alNavegar)="alNavegar()"
      />
    }
  </nav>

  <!-- Pie del menú lateral con anexo de soporte -->
  <app-info-soporte-pie [colapsado]="sidebarColapsado()" />
</aside>
