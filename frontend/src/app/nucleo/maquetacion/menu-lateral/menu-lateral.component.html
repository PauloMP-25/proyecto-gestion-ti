<!-- Backdrop para cerrar en móvil al dar tap fuera -->
<div 
  class="sidebar-backdrop" 
  [class.abierto]="sidebarAbierto()" 
  (click)="cerrarSidebarMovil()">
</div>

<aside 
  class="menu-lateral" 
  [class.movil-abierto]="sidebarAbierto()"
  [class.colapsado]="sidebarColapsado()">

  <div class="sidebar-header-movil">
    <app-marca-hospital [modoCompacto]="true" subtitulo="TI" />
    <button 
      type="button" 
      class="btn-cerrar-movil" 
      (click)="cerrarSidebarMovil()" 
      aria-label="Cerrar menú">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (seccion of seccionesMenu(); track seccion.encabezado) {
      <div class="seccion-grupo">
        @if (seccion.encabezado && !sidebarColapsado()) {
          <h3 class="seccion-titulo">{{ seccion.encabezado }}</h3>
        }

        <ul class="lista-items">
          @for (item of seccion.items; track item.ruta) {
            <li class="item-fila">
              <app-item-nav
                [titulo]="item.titulo"
                [ruta]="item.ruta"
                [icono]="item.icono"
                [badge]="item.badge"
                [badgeTipo]="item.badgeTipo"
                [colapsado]="sidebarColapsado()"
                [exacto]="item.ruta === '/portal' || item.ruta === '/mi-turno' || item.ruta === '/panel-control'"
                (clickItem)="cerrarSidebarMovil()"
              />
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <!-- Pie del menú lateral -->
  <app-info-soporte-pie [colapsado]="sidebarColapsado()" />
</aside>
