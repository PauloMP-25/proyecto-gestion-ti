<header class="barra-superior" role="banner">
  <!-- Izquierda: Botón hamburguesa accesible + Identidad del Hospital -->
  <div class="seccion-izquierda">
    <app-boton-hamburguesa
      [expandido]="expandido()"
      (alAlternar)="alternarSidebar()"
    />

    <app-marca-hospital subtitulo="Mesa de Ayuda" />
  </div>

  <!-- Derecha: Acciones globales (Tema, Notificaciones, Menú de usuario) -->
  <div class="seccion-derecha">
    <app-alternador-tema />

    <app-campana-notificaciones
      [conteo]="notificaciones.length"
      [notificaciones]="notificaciones"
    />

    @if (usuarioActual(); as usuario) {
      <div class="divisor-vertical" aria-hidden="true"></div>

      <app-usuario-perfil-menu
        [usuario]="usuario"
        (alCerrarSesion)="cerrarSesion()"
      />
    }
  </div>
</header>
