<header class="barra-superior">
  <!-- Izquierda: Botón Hamburguesa + Logo HSMSI e Identidad -->
  <div class="seccion-izquierda">
    <button
      type="button"
      class="btn-icono hamburguesa"
      (click)="alternarSidebar()"
      aria-label="Alternar menú lateral"
      title="Alternar menú lateral"
    >
      <span class="material-symbols-outlined">menu</span>
    </button>

    <app-marca-hospital subtitulo="Mesa de Ayuda" />
  </div>

  <!-- Derecha: Perfil del Usuario Autenticado y Menú de Sesión -->
  <div class="seccion-derecha" *ngIf="usuarioActual() as usuario">
    <app-usuario-perfil-menu
      [usuario]="usuario"
      (cerrarSesion)="cerrarSesion()"
    />
  </div>
</header>
