<div class="equipos-filtros">
  <app-campo-filtro
    etiqueta="Área hospitalaria"
    textoTodos="Todas las áreas"
    [opciones]="opcionesArea()"
    [(valor)]="area"
  ></app-campo-filtro>

  <app-campo-filtro
    etiqueta="Tipo de equipo"
    textoTodos="Todos los tipos"
    [opciones]="opcionesTipo"
    [(valor)]="tipo"
  ></app-campo-filtro>

  <app-campo-filtro
    tipo="casilla"
    etiqueta="Sin IP asignada"
    [(valor)]="sinIp"
  ></app-campo-filtro>
</div>
