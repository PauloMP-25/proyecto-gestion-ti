<div class="login-container" [class.design-two]="isDesignTwo">
  <div class="login-card">
    <div class="hospital-badge">
      <span class="secure-dot"></span>
      Portal Seguro IT
    </div>

    <div class="logo-area">
      <img src="/assets/logo_hsmsi.jpeg" alt="Logo Hospital Santa María del Socorro" class="hospital-logo">
    </div>

    <h1 class="login-title">Mesa de Ayuda TI</h1>
    <p class="login-subtitle">Portal de Acceso Institucional y Soporte Clínico</p>

    <form>
      <div class="form-group">
        <label for="email">Correo Electrónico Institucional</label>
        <div class="input-wrapper">
          <span class="icon">✉️</span>
          <input type="email" id="email" placeholder="usuario@hsms.gob.pe" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña de Red / Dominio</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password">
        </div>
      </div>

      <div class="form-actions-row">
        <label class="remember-me">
          <input type="checkbox">
          Recordar credenciales
        </label>
        <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
      </div>

      <button type="button" class="btn-primary" (click)="login()">
        Iniciar Sesión
        <span>→</span>
      </button>
      
      <button type="button" class="btn-secondary" (click)="toggleDesign()">
        Ver Diseño Alternativo
      </button>
    </form>

    <div class="ad-badge">
      © 2024 Hospital Santa María del Socorro.
    </div>
  </div>
</div>
