<div class="login-page-wrapper">
  <!-- Top Navbar Header -->
  <header class="top-navbar">
    <div class="nav-left">
      <img src="/assets/logo.ico" alt="Logo Hospital Santa María del Socorro" class="nav-logo">
      <span class="nav-title">Hospital Santa María del Socorro de Ica</span>
    </div>
  </header>

  <main class="login-content-container">
    <div class="layout-d1">
      <div class="image-side" aria-hidden="true"></div>
      <div class="form-side">
        <div class="form-container">
          <h1 class="login-title">Mesa de Ayuda</h1>
          <p class="login-subtitle">Acceda a su cuenta institucional</p>
          
          <form class="login-form" (submit)="$event.preventDefault(); login()">
            <div class="form-group">
              <label for="usuario">Usuario</label>
              <input id="usuario" type="text" placeholder="Ingrese su usuario" autocomplete="username">
            </div>
            <div class="form-group">
              <label for="password">Contraseña</label>
              <div class="password-input">
                <input 
                  id="password" 
                  [type]="mostrarPassword ? 'text' : 'password'" 
                  placeholder="Ingrese su contraseña"
                  autocomplete="current-password">
                <span 
                  class="eye-icon" 
                  (click)="toggleMostrarPassword()" 
                  (keydown.enter)="toggleMostrarPassword()"
                  tabindex="0"
                  role="button"
                  [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
                  {{ mostrarPassword ? '🙈' : '👁️' }}
                </span>
              </div>
            </div>
            <div class="forgot-link-container">
              <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
            
            <p class="copyright-text">© 2026 Hospital Santa María del Socorro. Todos los derechos reservados.</p>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
