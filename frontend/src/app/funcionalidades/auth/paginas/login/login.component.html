<div class="login-container">
  <div class="login-card">
    <div class="hospital-badge">
      <span class="secure-dot"></span>
      Portal Seguro IT
    </div>

    <div class="logo-area">
      <!-- Logo placeholder, will be replaced with real hospital logo -->
      <div class="hospital-icon">🏥</div>
    </div>

    <h1 class="login-title">Mesa de Ayuda TI</h1>
    <p class="login-subtitle">Portal de Acceso Institucional y Soporte Clínico</p>

    <form>
      <div class="form-group">
        <label for="email">Correo Electrónico Institucional</label>
        <div class="input-wrapper">
          <span class="icon">✉️</span>
          <input type="email" id="email" placeholder="usuario@hsms.gob.pe" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña de Red / Dominio</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password">
        </div>
      </div>

      <div class="form-actions-row">
        <label class="remember-me">
          <input type="checkbox">
          Recordar credenciales
        </label>
        <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
      </div>

      <button type="button" class="btn-primary" (click)="login()">
        Iniciar Sesión
        <span>→</span>
      </button>
    </form>

    <div class="ad-badge">
      <span>🛡️</span> Autenticación vinculada a Active Directory
    </div>
  </div>

  <div class="support-footer">
    Soporte de Emergencia TI: Anexo 2400 (24/7)<br>
    © 2026 Hospital Santa María del Socorro · Todos los derechos reservados.
  </div>
</div>
