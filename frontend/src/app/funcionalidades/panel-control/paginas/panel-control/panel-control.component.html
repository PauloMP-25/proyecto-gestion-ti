<div class="dashboard-contenedor">
  <!-- Cabecera de Navegación por Pestañas (En lugar del título duplicado) -->
  <header class="consola-header">
    <div class="consola-header__izq">
      <nav class="nav-pestanas" role="tablist" aria-label="Secciones del Panel de Control">
        <button 
          type="button" 
          role="tab"
          class="tab-btn" 
          [class.tab-btn--activo]="pestanaActiva() === 'metricas'"
          (click)="seleccionarPestana('metricas')"
          [attr.aria-selected]="pestanaActiva() === 'metricas'">
          <span class="tab-btn__texto">Control en vivo</span>
        </button>

        <button 
          type="button" 
          role="tab" 
          class="tab-btn" 
          [class.tab-btn--activo]="pestanaActiva() === 'graficos'"
          (click)="seleccionarPestana('graficos')"
          [attr.aria-selected]="pestanaActiva() === 'graficos'">
          <span class="tab-btn__texto">Gráficos y Estadísticas</span>
        </button>
      </nav>
    </div>

    <div class="consola-header__der">
      <div class="acciones-header">
        <button 
          type="button" 
          class="btn-refrescar" 
          (click)="refrescar()" 
          title="Actualizar datos del panel">
          <app-icono nombre="sync" tamano="xs"></app-icono>
          <span>Actualizar</span>
        </button>

        <button 
          type="button" 
          class="btn-accion-reporte btn-accion-reporte--pdf" 
          (click)="descargarReportePdf()" 
          [disabled]="descargandoPdf()"
          title="Descargar informe ejecutivo oficial en formato PDF">
          <span class="material-symbols-outlined" aria-hidden="true">picture_as_pdf</span>
          <span>{{ descargandoPdf() ? 'Generando...' : 'Exportar PDF' }}</span>
        </button>

        @if (esAdministrador()) {
          <button 
            type="button" 
            class="btn-accion-reporte btn-accion-reporte--correo" 
            (click)="enviarReporteCorreo()" 
            [disabled]="enviandoCorreo()"
            title="Enviar informe ejecutivo en PDF al correo institucional del Administrador">
            <span class="material-symbols-outlined" aria-hidden="true">mail</span>
            <span>{{ enviandoCorreo() ? 'Enviando...' : 'Enviar al correo' }}</span>
          </button>
        }

        <app-boton 
          variante="primario" 
          icono="add"
          ariaLabel="Registrar nuevo incidente"
          (click)="onNuevoIncidente()">
          Nuevo Incidente
        </app-boton>
      </div>
    </div>
  </header>

  <!-- CONTENIDO DE LAS PESTAÑAS -->

  <!-- PESTAÑA 1: Control en vivo (Métricas y Cronómetro) -->
  @if (pestanaActiva() === 'metricas') {
    <div class="pestana-contenido" role="tabpanel" aria-label="Métricas y Cronómetro SLA">
      <!-- 4 Métricas Esenciales -->
      <section class="seccion-kpis" aria-label="Indicadores Operativos Clave">
        <app-kpi-panel [kpis]="kpis()" [rol]="rolActual()"></app-kpi-panel>
      </section>

      <!-- Cronómetro y Reloj de Ticket en Atención -->
      <section class="seccion-cronometro" aria-label="Cronómetro de Atención y SLA">
        <app-reloj-ticket-activo
          [ticket]="ticketEnAtencion()"
          [ticketsDisponibles]="ticketsFiltrados()"
          (alSeleccionarOtroTicket)="onSeleccionarTicket($event)"
          (alResolverTicket)="onResolverTicket($event)"
          (alEscalarTicket)="onEscalarTicket($event)">
        </app-reloj-ticket-activo>
      </section>
    </div>
  }

  <!-- PESTAÑA 2: Gráficos y Estadísticas (4 Cuadrantes Dinámicos) -->
  @if (pestanaActiva() === 'graficos') {
    <div class="pestana-contenido" role="tabpanel" aria-label="Gráficos y Estadísticas de Atención">
      <div class="grid-cuatro-graficos">
        <!-- 1. Incidentes por Servicio Clínico (Áreas Reales del Hospital) -->
        <div class="cuadrante-grafico">
          <app-grafico-por-servicio></app-grafico-por-servicio>
        </div>

        <!-- 2. Fallas por Activo e Infraestructura Hospitalaria -->
        <div class="cuadrante-grafico">
          <app-distribucion-tipo></app-distribucion-tipo>
        </div>

        <!-- 3. Curva de Carga por Turnos: Guardia Mañana vs. Tarde (Lunes a Viernes) -->
        <div class="cuadrante-grafico">
          <app-grafico-carga-turnos></app-grafico-carga-turnos>
        </div>

        <!-- 4. Disponibilidad del Inventario y Equipos en Préstamo -->
        <div class="cuadrante-grafico">
          <app-grafico-estado-equipos></app-grafico-estado-equipos>
        </div>
      </div>
    </div>
  }

  <!-- Modales Accesibles de Resolución y Escalamiento -->
  @if (modalEscalarAbierto() && ticketParaAccion(); as t) {
    <app-dialogo-escalar-ticket
      [ticketId]="ticketIdNumerico"
      [codigo]="t.codigo"
      [titulo]="t.titulo"
      [procesando]="procesandoAccion()"
      (alCancelar)="modalEscalarAbierto.set(false)"
      (alConfirmarTexto)="confirmarEscalamiento($event)">
    </app-dialogo-escalar-ticket>
  }

  @if (modalResolverAbierto() && ticketParaAccion(); as t) {
    <app-dialogo-resolver-ticket
      [ticketId]="ticketIdNumerico"
      [codigo]="t.codigo"
      [procesando]="procesandoAccion()"
      (alCancelar)="modalResolverAbierto.set(false)"
      (alConfirmar)="confirmarResolucion($event.accionRealizada)">
    </app-dialogo-resolver-ticket>
  }
</div>
