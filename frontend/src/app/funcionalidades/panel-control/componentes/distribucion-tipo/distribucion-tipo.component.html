<div class="tarjeta-distribucion" role="region" aria-label="Distribución por Tipo de Falla">
  <div class="tarjeta-distribucion__header">
    <h3 class="tarjeta-distribucion__titulo">Distribución por Tipo</h3>
    <p class="tarjeta-distribucion__subtitulo">Clasificación taxonómica de tickets activos</p>
  </div>

  <div class="tarjeta-distribucion__lista">
    @for (item of distribucion(); track item.categoria) {
      <div class="item-distribucion">
        <div class="item-distribucion__cabecera">
          <div class="categoria-info">
            <app-icono [nombre]="item.icono" tamano="sm" class="categoria-icono"></app-icono>
            <div>
              <strong class="categoria-titulo">{{ item.categoria }}</strong>
              <span class="categoria-ejemplo">{{ item.ejemplo }}</span>
            </div>
          </div>
          <div class="categoria-metrica">
            <span class="categoria-pct">{{ item.porcentaje }}%</span>
            <span class="categoria-casos">{{ item.casos }} casos</span>
          </div>
        </div>

        <div class="item-distribucion__track" aria-hidden="true">
          <div class="item-distribucion__barra" [style.width.%]="item.porcentaje"></div>
        </div>
      </div>
    }
  </div>
</div>
