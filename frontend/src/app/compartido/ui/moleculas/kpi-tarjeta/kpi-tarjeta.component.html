<div 
  class="kpi-tarjeta" 
  [class.kpi--cumple]="kpi().estado === 'CUMPLE'"
  [class.kpi--riesgo]="kpi().estado === 'EN_RIESGO'"
  [class.kpi--incumple]="kpi().estado === 'INCUMPLE'">

  <!-- Línea 1: KPI-N° a la izquierda y ESTADO a la derecha -->
  <div class="kpi-tarjeta__linea-superior">
    <span class="kpi-tarjeta__codigo">{{ kpi().codigo }}</span>

    <span 
      class="kpi-tarjeta__badge-estado"
      [class.badge--cumple]="kpi().estado === 'CUMPLE'"
      [class.badge--riesgo]="kpi().estado === 'EN_RIESGO'"
      [class.badge--incumple]="kpi().estado === 'INCUMPLE'">
      @if (kpi().estado === 'CUMPLE') {
        <app-icono nombre="check_circle" tamano="xs"></app-icono>
        <span>Cumple</span>
      } @else if (kpi().estado === 'EN_RIESGO') {
        <app-icono nombre="warning" tamano="xs"></app-icono>
        <span>En riesgo</span>
      } @else {
        <app-icono nombre="cancel" tamano="xs"></app-icono>
        <span>Incumple</span>
      }
    </span>
  </div>

  <!-- Línea 2: Título debajo de la cabecera (texto completo sin cortarse) -->
  <h3 class="kpi-tarjeta__titulo">{{ kpi().titulo }}</h3>

  <!-- Línea 3: En el medio el valor numérico y unidad -->
  <div class="kpi-tarjeta__cuerpo">
    <div class="kpi-tarjeta__valor-fila">
      <div class="valor-agrupado">
        <span class="kpi-tarjeta__valor">{{ kpi().valor }}</span>
        @if (kpi().unidad) {
          <span class="kpi-tarjeta__unidad">{{ kpi().unidad }}</span>
        }
      </div>
    </div>
  </div>

  <!-- Línea 4: Debajo de la línea divisoria el valor de la meta oficial -->
  <div class="kpi-tarjeta__meta-fila">
    <span class="kpi-tarjeta__meta-label">
      Meta: <strong>{{ kpi().comparador }} {{ kpi().meta }}</strong>
    </span>
  </div>
</div>
