<div 
  class="kpi-tarjeta" 
  [class.kpi--cumple]="kpi().estado === 'CUMPLE'"
  [class.kpi--riesgo]="kpi().estado === 'EN_RIESGO'"
  [class.kpi--incumple]="kpi().estado === 'INCUMPLE'">

  <!-- Línea 1: KPI-N° a la izquierda y ESTADO a la derecha -->
  <div class="kpi-tarjeta__linea-superior">
    <span class="kpi-tarjeta__codigo">{{ kpi().codigo }}</span>

    <span 
      class="kpi-tarjeta__badge-estado"
      [class.badge--cumple]="kpi().estado === 'CUMPLE'"
      [class.badge--riesgo]="kpi().estado === 'EN_RIESGO'"
      [class.badge--incumple]="kpi().estado === 'INCUMPLE'">
      @if (kpi().estado === 'CUMPLE') {
        <app-icono nombre="check_circle" tamano="xs"></app-icono>
        <span>Cumple</span>
      } @else if (kpi().estado === 'EN_RIESGO') {
        <app-icono nombre="warning" tamano="xs"></app-icono>
        <span>En riesgo</span>
      } @else {
        <app-icono nombre="cancel" tamano="xs"></app-icono>
        <span>Incumple</span>
      }
    </span>
  </div>

  <!-- Línea 2: Título centrado entre la cabecera (KPI y badge) y los valores -->
  <h3 class="kpi-tarjeta__titulo" [title]="kpi().titulo">
    <span class="kpi-tarjeta__titulo-texto">{{ kpi().titulo }}</span>
  </h3>

  <!-- Línea 3: En la misma línea el VALOR y la META (VALOR  <= O >= VALOR) -->
  <div class="kpi-tarjeta__valores-fila">
    <div class="valor-actual">
      <span class="valor-numero">{{ kpi().valor }}</span>
      @if (kpi().unidad) {
        <span class="valor-unidad">{{ kpi().unidad }}</span>
      }
    </div>

    <div class="meta-inline" [title]="'Meta objetivo oficial: ' + simboloComparador() + ' ' + kpi().meta">
      <span class="meta-comparador">{{ simboloComparador() }}</span>
      <span class="meta-objetivo">{{ kpi().meta }}</span>
    </div>
  </div>
</div>
