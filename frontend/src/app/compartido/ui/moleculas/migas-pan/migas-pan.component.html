@if (migas().length > 0) {
  <nav aria-label="Ruta de navegación" class="migas-pan">
    <ol class="migas-lista" role="list">
      @for (miga of migas(); track miga.etiqueta + $index; let ultimo = $last) {
        <li class="miga-item" [class.es-ultimo]="ultimo" role="listitem">
          @if (!ultimo && miga.ruta) {
            <a 
              [routerLink]="miga.ruta" 
              class="miga-enlace"
              (click)="onNavegarMiga(miga)"
              [title]="'Ir a ' + miga.etiqueta">
              <span class="miga-texto-padre">{{ miga.etiqueta }}</span>
            </a>
            <span class="miga-separador" aria-hidden="true">
              <span class="miga-chevron">›</span>
            </span>
          } @else {
            <span class="miga-actual" aria-current="page">
              {{ miga.etiqueta }}
            </span>
          }
        </li>
      }
    </ol>
  </nav>
}
