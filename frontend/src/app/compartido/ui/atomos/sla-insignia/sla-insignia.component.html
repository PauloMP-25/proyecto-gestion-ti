<span class="insignia-sla" [ngClass]="config().clase">
  @if (mostrarIcono()) {
    <app-icono [nombre]="config().icono" tamano="xs" class="insignia-sla__icono"></app-icono>
  }
  <span class="insignia-sla__texto">
    {{ texto() ?? config().textoDefault }}
  </span>
  @if (limite(); as fechaLimite) {
    <span class="insignia-sla__tiempo">· {{ fechaLimite | tiempoRestante: ahora() }}</span>
  }
</span>
